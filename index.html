<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064E3B">
  <title>وجبتي — أكل بيتي مغربي أصيل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --green-950:#022c22;--green-900:#064e3b;--green-600:#047857;--amber:#fbbf24;--amber-dark:#f59e0b;
      --container-max:1140px;
      --space-1:8px;--space-2:12px;--space-3:18px;--space-4:24px;--space-5:32px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{height:100%}
    body{margin:0;font-family:'Tajawal',Tahoma,Arial,sans-serif;background:#f8fafaf0;color:#1c1917;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer;transition:all .2s ease}
    .container{max-width:var(--container-max);margin:auto;padding:0 18px;width:100%}
    main.client{flex:1 1 auto;width:100%;padding-bottom:8px}
    footer{flex-shrink:0}

    header{background:linear-gradient(135deg,#064e3b,#022c22);color:#fff;position:relative;overflow:hidden;padding:30px 0 45px;border-bottom-left-radius:32px;border-bottom-right-radius:32px;box-shadow:0 10px 30px #064e3b22}
    header::before{content:"";position:absolute;inset:0;opacity:.06;background-image:linear-gradient(45deg,transparent 46%,#fbbf24 47%,#fbbf24 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fbbf24 47%,#fbbf24 53%,transparent 54%);background-size:20px 20px}
    .hero{position:relative;z-index:1;text-align:center}
    .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;flex-wrap:wrap;gap:10px}
    .topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .badge{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;backdrop-filter:blur(4px);white-space:nowrap}
    .admin-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;text-decoration:none}
    .admin-btn:hover{background:rgba(255,255,255,.25)}
    .lang-switch{display:flex;gap:3px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px}
    .lang-btn{border:0;background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;opacity:.65;display:flex;align-items:center;gap:5px}
    .lang-btn.active{background:#fbbf24;color:#064e3b;opacity:1}
    .flag-icon{width:16px;height:12px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.5);flex-shrink:0;display:block}
    .logo{display:block;font-size:52px;font-weight:900;color:#fbbf24;margin:0 0 4px;letter-spacing:-1px;line-height:1.1}
    .tagline{display:block;font-size:16px;color:#d1fae5;margin:0;font-weight:500}

    /* زر القائمة الجانبية (☰) */
    .menu-btn{position:relative;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:14px;width:38px;height:38px;font-size:18px;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
    .menu-btn:hover{background:rgba(255,255,255,.25)}
    .menu-dot{display:none;position:absolute;top:-2px;left:-2px;width:10px;height:10px;background:#f59e0b;border:2px solid #064e3b;border-radius:50%}

    /* القائمة الجانبية نفسها */
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(2,44,34,.55);backdrop-filter:blur(2px);z-index:150}
    .sidebar-overlay.show{display:block}
    .sidebar{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:82vw;background:#fff;z-index:151;box-shadow:8px 0 30px #00000022;transform:translateX(-100%);transition:transform .28s ease;display:flex;flex-direction:column}
    .sidebar.show{transform:translateX(0)}
    .sidebar-head{background:linear-gradient(135deg,#064e3b,#022c22);color:#fff;padding:22px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .sidebar-head b{font-size:20px;font-weight:900;color:#fbbf24}
    .sidebar-close{border:0;background:rgba(255,255,255,.15);color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}
    .sidebar-body{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
    .side-item{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;font-size:15px;font-weight:700;color:#1c1917;text-align:right}
    html[dir="ltr"] .side-item{text-align:left}
    .side-item:hover{background:#f0fdf4}
    .side-icon{position:relative;width:38px;height:38px;border-radius:50%;background:#f0fdf4;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .side-label{flex:1}
    .side-badge{display:none;position:absolute;top:-2px;left:-2px;width:9px;height:9px;background:#f59e0b;border:2px solid #fff;border-radius:50%}

    /* بانر وجبة اليوم */
    .daily-meal{position:relative;border-radius:24px;overflow:hidden;margin:18px 0 22px;box-shadow:0 10px 30px #00000010;display:none}
    .daily-meal.show{display:block}
    .daily-meal img{width:100%;height:190px;object-fit:cover;display:block;background:#f0fdf4}
    .daily-meal-badge{position:absolute;top:14px;right:14px;background:rgba(6,78,59,.85);backdrop-filter:blur(4px);color:#fbbf24;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:800;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    html[dir="ltr"] .daily-meal-badge{right:auto;left:14px}

    /* تبويبات الفئات — دوائر بأيقونات موحّدة الحجم */
    .categories{display:flex;gap:14px;overflow-x:auto;justify-content:center;margin:0 0 20px;padding:16px 10px;background:#fff;border:1px solid #f0f0f0;border-radius:22px;box-shadow:0 4px 15px #00000005;scrollbar-width:none}
    .categories::-webkit-scrollbar{display:none}
    .cat{border:0;background:none;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:7px;color:#57534e;padding:2px 6px}
    .cat-circle{width:56px;height:56px;border-radius:50%;background:#fff;border:1.5px solid #e7e5e4;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;line-height:1;box-shadow:0 2px 6px #00000005;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease}
    .cat-label{font-size:12.5px;font-weight:700;white-space:nowrap}
    .cat:hover .cat-circle{border-color:#064e3b}
    .cat.active .cat-circle{background:#064e3b;border-color:#064e3b;box-shadow:0 3px 10px #064e3b33}
    .cat.active .cat-label{color:#064e3b;font-weight:900}

    .trust{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
    .trust-card{background:#fff;border:1px solid #f0f0f0;border-radius:20px;padding:14px;text-align:center;box-shadow:0 4px 15px #00000005}
    .trust-card b{display:block;color:#064e3b;font-size:14.5px;font-weight:800}.trust-card span{font-size:12.5px;color:#78716c}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
    .skel-meal{background:#fff;border:1px solid #f0f0f0;border-radius:24px;overflow:hidden}
    .skel-img{height:190px;background:linear-gradient(90deg,#f0fdf4 25%,#e7f5ee 37%,#f0fdf4 63%);background-size:600px 100%;animation:shimmer 1.4s infinite linear}
    .skel-body{padding:18px}
    .skel-line{height:12px;border-radius:6px;background:linear-gradient(90deg,#f5f5f4 25%,#eeeeec 37%,#f5f5f4 63%);background-size:600px 100%;animation:shimmer 1.4s infinite linear;margin-bottom:10px}
    .skel-line.w60{width:60%}.skel-line.w90{width:90%}.skel-line.w40{width:40%;margin-bottom:0}
    .meal{background:#fff;border:1px solid #f0f0f0;border-radius:24px;overflow:hidden;box-shadow:0 6px 20px #00000006;transition:.3s ease;display:flex;flex-direction:column}
    .meal:hover{transform:translateY(-4px);box-shadow:0 12px 30px #00000012}
    .meal-img{height:190px;background:#f0fdf4;position:relative;overflow:hidden}
    .meal-img img{width:100%;height:100%;object-fit:cover;transition:.5s}
    .meal:hover img{transform:scale(1.06)}
    .category{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(4px);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;color:#064e3b;box-shadow:0 2px 8px #0002}
    html[dir="ltr"] .category{right:auto;left:12px}
    .meal-body{padding:18px;display:flex;flex-direction:column;flex:1}
    .meal h3{margin:0 0 6px;font-size:18.5px;font-weight:800;color:#1c1917}
    .desc{color:#78716c;font-size:13.5px;line-height:1.6;min-height:42px;flex:1}
    .meal-bottom{border-top:1px solid #f5f5f4;margin-top:14px;padding-top:14px;display:flex;align-items:center;justify-content:space-between}
    .price{font-weight:900;color:#047857;font-size:19px}
    .add,.checkout{border:0;background:#064e3b;color:#fff;border-radius:999px;padding:10px 20px;font-weight:800;font-size:14px}
    .add:hover,.checkout:hover{background:#047857}
    .qty{display:flex;align-items:center;gap:10px;background:#f5f5f4;border-radius:999px;padding:4px 8px}
    .qty button{border:0;width:28px;height:28px;border-radius:50%;background:#fff;font-weight:bold;box-shadow:0 1px 3px #0001}
    .qty .plus{background:#047857;color:#fff}

    .panel{background:#fff;border:1px solid #f0f0f0;border-radius:28px;padding:22px;margin:26px 0;box-shadow:0 10px 30px #00000008}
    .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
    .plan{border:2px solid #e7e5e4;background:#fff;border-radius:20px;padding:16px;text-align:right;cursor:pointer;transition:.2s}
    html[dir="ltr"] .plan{text-align:left}
    .plan.active{background:#f0fdf4;color:#064e3b;border-color:#064e3b}
    .plan strong{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:4px}
    .discount{font-size:11px;background:#fbbf24;color:#064e3b;border-radius:999px;padding:3px 8px;font-weight:800}
    .cart-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f5f5f4;padding:14px 0}
    .summary{background:#fafaf9;border-radius:20px;padding:18px;margin-top:18px;border:1px solid #f0f0f0}
    .sumrow{display:flex;justify-content:space-between;padding:6px 0;color:#57534e;font-size:14px}
    .sumrow.total{border-top:2px dashed #e7e5e4;margin-top:8px;padding-top:14px;color:#064e3b;font-size:20px;font-weight:900}
    .checkout{width:100%;background:#f59e0b;color:#1c1917;margin-top:16px;padding:14px;font-size:16px;border-radius:18px;box-shadow:0 4px 15px #f59e0b33}
    .checkout:hover{background:#d97706}

    footer{text-align:center;padding:26px 15px calc(20px + env(safe-area-inset-bottom,0px));color:#a8a29e;font-size:13px;font-weight:500}
    .empty{text-align:center;padding:50px 20px;background:#fff;border:2px dashed #e7e5e4;border-radius:24px;color:#78716c;font-size:15px}

    .schedule-box{background:#fffbeb;border:1px solid #fde68a;border-radius:20px;padding:16px;margin:18px 0}
    .schedule-title{font-weight:900;color:#92400e;margin-bottom:10px;font-size:14px}
    .date-grid,.time-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .time-row{margin-top:10px}
    .field-note{font-size:11px;color:#78716c;margin-top:6px;line-height:1.4}
    .schedule-preview{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:14px;padding:12px;font-size:13px;margin-top:12px;font-weight:500}

    .pay-toggle{width:100%;text-align:right;border:2px solid #a7f3d0;background:#fff;border-radius:16px;padding:12px 14px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;color:#1c1917}
    html[dir="ltr"] .pay-toggle{text-align:left}
    .pay-toggle:hover{border-color:#047857}
    .pay-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
    .pay-item{border:2px solid #e7e5e4;background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:13px;text-align:right;transition:.2s}
    .pay-icon-img{width:18px;height:18px;border-radius:5px;object-fit:cover;vertical-align:middle;margin:0 2px}
    html[dir="ltr"] .pay-item{text-align:left}
    .pay-item.active{border-color:#064e3b;background:#f0fdf4;color:#064e3b}
    @media(max-width:480px){.pay-list{grid-template-columns:1fr}}
    .pay-info-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #a7f3d0}
    .pay-info-row>div{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#065f46}
    .pay-info-value{font-size:15px;letter-spacing:.3px;color:#064e3b;direction:ltr;unicode-bidi:plaintext}
    .pay-info-note{margin-top:10px;font-size:12px;color:#065f46}
    .copy-btn{flex-shrink:0;border:1px solid #059669;background:#fff;color:#047857;border-radius:10px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer}
    .copy-btn:hover{background:#ecfdf5}

    .modal{position:fixed;inset:0;background:rgba(2,44,34,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
    .modal.show{display:flex}
    .modal-box{background:#fff;border-radius:30px;width:100%;max-width:520px;padding:26px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px #00000040}
    .modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;padding-bottom:14px;margin-bottom:16px}
    .modal-head h3{margin:0;font-size:18px;color:#064e3b;font-weight:800}
    .close{border:0;background:#f5f5f4;width:32px;height:32px;border-radius:50%;font-size:18px;color:#78716c;display:flex;align-items:center;justify-content:center}
    .notice{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:16px;padding:12px;font-size:13px;color:#065f46;margin-bottom:16px;font-weight:500}

    .auth-tabs{display:flex;gap:8px;margin-bottom:16px}
    .auth-tab{flex:1;border:1.5px solid #e7e5e4;background:#fff;color:#78716c;border-radius:14px;padding:10px;font-weight:800;font-size:13px}
    .auth-tab.active{background:#064e3b;color:#fff;border-color:#064e3b}
    .gender-row{display:flex;gap:10px}
    .gender-opt{flex:1;border:1.5px solid #e7e5e4;border-radius:14px;padding:10px;text-align:center;font-weight:700;font-size:14px}
    .gender-opt.active{background:#f0fdf4;border-color:#064e3b;color:#064e3b}
    .social-divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:#a8a29e;font-size:12px;font-weight:700}
    .social-divider::before,.social-divider::after{content:"";flex:1;height:1px;background:#e7e5e4}
    .social-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid #e7e5e4;background:#fff;border-radius:14px;padding:11px;font-weight:700;font-size:14px;color:#1c1917;margin-top:10px;cursor:pointer;transition:.2s}
    .social-btn:hover{border-color:#a8a29e;background:#fafaf9}
    .social-btn.apple-btn{color:#fff;background:#000;border-color:#000}
    .social-btn.apple-btn:hover{background:#1c1917}
    .profile-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .avatar-circle{width:54px;height:54px;border-radius:50%;background:#f0fdf4;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #a7f3d0;flex-shrink:0}
    .profile-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f4;font-size:14px;color:#44403c}
    .link-btn{border:0;background:none;color:#047857;font-weight:800;font-size:13px;padding:4px}

    /* الدردشة مع الدعم */
    .chat-box{background:#fafaf9;border:1px solid #f0f0f0;border-radius:16px;padding:14px;height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
    .chat-bubble{max-width:80%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.5;word-break:break-word}
    .chat-mine{align-self:flex-end;background:#064e3b;color:#fff;border-bottom-left-radius:4px}
    .chat-theirs{align-self:flex-start;background:#fff;border:1px solid #e7e5e4;color:#1c1917;border-bottom-right-radius:4px}
    .chat-image{max-width:100%;max-height:220px;border-radius:12px;display:block;cursor:pointer;object-fit:cover}
    .chat-mine .chat-image{border:2px solid rgba(255,255,255,.3)}
    .chat-photo-btn{border:1px solid #d6d3d1;background:#fff;border-radius:999px;width:40px;height:40px;font-size:17px;flex-shrink:0;cursor:pointer}
    .chat-photo-btn:hover{background:#f5f5f4}
    .countdown{display:flex;gap:8px;justify-content:center;margin-top:16px}
    .countdown-box{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;text-align:center;min-width:56px}
    .countdown-box b{display:block;font-size:20px}
    .countdown-box span{font-size:10px;opacity:.8}

    label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:#44403c}
    input,textarea,select{width:100%;border:1.5px solid #e7e5e4;border-radius:14px;padding:12px 14px;outline:none;background:#fff;font-size:14px;transition:.2s}
    input:focus,textarea:focus,select:focus{border-color:#047857;box-shadow:0 0 0 3px #04785718}

    .location-btn{white-space:nowrap;border:0;background:#064e3b;color:#fff;border-radius:14px;padding:0 16px;font-weight:700;font-size:13px;height:46px;display:flex;align-items:center;gap:6px}
    .location-btn:hover{background:#047857}

    .mobile-cart{display:none;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:16px;background:#022c22;color:#fff;border-radius:24px;padding:14px 18px;z-index:90;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 15px 30px #00000040}
    .mobile-cart button{border:0;background:#fbbf24;color:#064e3b;border-radius:999px;padding:10px 20px;font-weight:900;font-size:14px;flex-shrink:0}
    /* هامش أمان تحت باش ما يبقاش المحتوى مخبي تحت شريط السلة، ولا متداخل مع أي زر تصفح/accessibility ديال المتصفح */
    body:has(.mobile-cart[style*="flex"]) main.client{padding-bottom:78px}

    /* بطاقة العضوية */
    .member-card{background:linear-gradient(135deg,#064e3b,#047857 60%,#0a5c46);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden;box-shadow:0 15px 30px #064e3b33}
    .member-card::before{content:"";position:absolute;top:-40px;left:-40px;width:140px;height:140px;background:rgba(251,191,36,.15);border-radius:50%}
    .member-card::after{content:"";position:absolute;bottom:-50px;right:-30px;width:160px;height:160px;background:rgba(255,255,255,.06);border-radius:50%}
    .member-card-brand{position:relative;font-weight:900;font-size:15px;color:#fbbf24;margin-bottom:18px;letter-spacing:.5px}
    .member-card-name{position:relative;font-size:22px;font-weight:900;margin-bottom:14px}
    .member-card-row{position:relative;display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid rgba(255,255,255,.15)}
    .member-card-row span{opacity:.8}
    .member-card-id{position:relative;margin-top:14px;font-size:11px;letter-spacing:1.5px;opacity:.7;font-family:monospace}
    .renew-btn{width:100%;border:0;background:#fbbf24;color:#064e3b;border-radius:999px;padding:12px;font-weight:900;font-size:14px;margin-top:12px;box-shadow:0 4px 15px #fbbf2440}
    .renew-btn:hover{background:#f59e0b}

    /* نظام النقاط والمكافآت */
    .points-hero{text-align:center;background:linear-gradient(135deg,#064e3b,#047857);color:#fff;border-radius:20px;padding:22px;margin-bottom:6px}
    .points-balance{font-size:38px;font-weight:900}
    .points-balance small{font-size:16px;font-weight:700;opacity:.85}
    .points-tier{margin-top:6px;font-size:14px;font-weight:800;color:#fbbf24}
    .progress-bar-wrap{background:#f0fdf4;border:1px solid #d1fae5;border-radius:999px;height:14px;overflow:hidden;margin-top:14px}
    .progress-bar-fill{background:linear-gradient(90deg,#fbbf24,#f59e0b);height:100%;border-radius:999px;transition:width .4s ease}
    .rewards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .reward-card{background:#fafaf9;border:1px solid #f0f0f0;border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
    .reward-name{font-weight:800;font-size:13px;color:#1c1917;margin-bottom:4px}
    .reward-desc{font-size:11px;color:#78716c;margin-bottom:8px}
    .reward-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px}
    .reward-cost{font-size:12px;font-weight:800;color:#047857}
    .reward-card .add{padding:6px 12px;font-size:11px}
    .referral-box{background:linear-gradient(135deg,#92400e,#d97706);color:#fff;border-radius:18px;padding:16px;margin-bottom:6px}
    .history-list{background:#fafaf9;border:1px solid #f0f0f0;border-radius:16px;overflow:hidden}
    .history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;border-bottom:1px solid #f0f0f0}
    .history-row:last-child{border-bottom:0}

    /* شاشات كبيرة — استغلال أفضل لمساحة الكمبيوتر */
    @media(min-width:1400px){
      :root{--container-max:1320px}
      .grid{grid-template-columns:repeat(4,1fr);gap:24px}
    }
    /* لابتوب / تابلت */
    @media(max-width:1024px) and (min-width:769px){
      :root{--container-max:960px}
      .grid{gap:16px}
    }
    @media(max-width:768px){
      .grid{grid-template-columns:1fr 1fr}.plans{grid-template-columns:1fr}.trust-card{padding:10px 6px}.meal-img{height:160px}
      .mobile-cart{display:flex}
      .cat-circle{width:50px;height:50px;font-size:20px}
      header{padding:24px 0 34px}
    }
    @media(max-width:480px){
      .grid{grid-template-columns:1fr}.trust{gap:6px}.trust-card b{font-size:12px}.trust-card span{font-size:10px}
      .date-grid,.time-row{grid-template-columns:1fr}
      .container{padding:0 14px}
      .categories{gap:10px;padding:14px 8px}
      .cat-circle{width:46px;height:46px;font-size:18px}
      .cat-label{font-size:11.5px}
      .daily-meal img{height:150px}
      .logo{font-size:38px}
      .tagline{font-size:14px;padding:0 6px}
    }
  </style>
</head>
<body>

<header>
  <div class="container hero">
    <div class="topbar">
      <span class="badge" id="badgeText">✨ أكل صحي ولذيذ</span>
      <div class="topbar-right">
        <div class="lang-switch">
          <button class="lang-btn" data-lang="ar" onclick="switchLang('ar')"><img class="flag-icon" src="https://flagcdn.com/w40/ma.png" alt="المغرب" loading="lazy"> AR</button>
          <button class="lang-btn" data-lang="fr" onclick="switchLang('fr')"><img class="flag-icon" src="https://flagcdn.com/w40/fr.png" alt="France" loading="lazy"> FR</button>
        </div>
        <button class="menu-btn" id="menuBtn" onclick="openSidebar()" aria-label="القائمة">☰<span class="menu-dot" id="menuDot"></span></button>
      </div>
    </div>
    <h1 class="logo">وجبتي</h1>
    <p class="tagline" id="tagline">أكل بيتي مغربي أصيل — بنين، سخون، ويوصل حتى لباب دارك</p>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <b>وجبتي</b>
    <button class="sidebar-close" onclick="closeSidebar()">×</button>
  </div>
  <div class="sidebar-body" id="sidebarBody"></div>
</aside>

<main class="container client" id="client">
  <div class="daily-meal" id="dailyMealBanner">
    <span class="daily-meal-badge" id="dailyMealBadge">🍽 وجبة اليوم</span>
    <img id="dailyMealImg" src="" alt="وجبة اليوم">
  </div>
  <div class="categories" id="categories"></div>
  <div class="trust">
    <div class="trust-card"><b id="trust1b">✓ طازج يومياً</b><span id="trust1s">تحضير بعناية</span></div>
    <div class="trust-card"><b id="trust2b">◷ توصيل مريح</b><span id="trust2s">حتى لباب دارك</span></div>
    <div class="trust-card"><b id="trust3b">🍽 مذاق الدار</b><span id="trust3s">وصفات مغربية</span></div>
  </div>
  <div class="grid" id="meals">
    <div class="skel-meal"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w90"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
    <div class="skel-meal"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w90"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
    <div class="skel-meal"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w90"></div><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>
  </div>
  <div id="cartPanel"></div>
</main>

<div class="mobile-cart" id="mobileCart">
  <div><small style="color:#a7f3d0" id="mobileTotalLabel">الإجمالي</small><br><b id="mobileTotal" style="font-size:17px">0 درهم</b></div>
  <button onclick="openCheckout()" id="mobileCheckoutBtn">إتمام الطلب ←</button>
</div>

<footer>© <span id="year"></span> وجبتي — <span id="footerText">جودة وطعم الدار في كل وجبة</span></footer>

<div class="modal" id="checkoutModal">
  <div class="modal-box" id="checkoutContent"></div>
</div>

<div class="modal" id="membershipModal">
  <div class="modal-box" id="membershipContent"></div>
</div>

<div class="modal" id="accountModal">
  <div class="modal-box" id="accountContent"></div>
</div>

<div class="modal" id="rewardsModal">
  <div class="modal-box" id="rewardsContent"></div>
</div>

<div class="modal" id="rateModal">
  <div class="modal-box" id="rateContent"></div>
</div>

<div class="modal" id="supportModal">
  <div class="modal-box" id="supportContent"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
